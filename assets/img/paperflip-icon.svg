<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- ink-wash backdrop -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2B27"/>
      <stop offset="0.55" stop-color="#1A1816"/>
      <stop offset="1" stop-color="#0E0D0C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.56" r="0.5">
      <stop offset="0" stop-color="#E0553C" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C8442F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C8442F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist" cx="0.25" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#F7F3E9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F7F3E9" stop-opacity="0"/>
    </radialGradient>
    <!-- glass pane -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.7" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <!-- vermilion seal -->
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E35A41"/>
      <stop offset="1" stop-color="#B0331F"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="22"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect x="40" y="40" width="944" height="944" rx="215"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bg)"/>
    <!-- brush wash strokes behind the glass -->
    <path d="M120 760 C 330 690, 600 820, 930 700" stroke="#3A3631" stroke-width="90" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#blur40)"/>
    <circle cx="512" cy="560" r="380" fill="url(#glow)"/>
    <!-- ink blooms that the glass refracts -->
    <circle cx="300" cy="330" r="170" fill="#D9573F" opacity="0.55" filter="url(#blur40)"/>
    <circle cx="760" cy="720" r="190" fill="#C98A12" opacity="0.35" filter="url(#blur40)"/>
    <circle cx="740" cy="300" r="120" fill="#F7F3E9" opacity="0.18" filter="url(#blur40)"/>
    <!-- a brushed ensō -->
    <path d="M 512 168 A 344 344 0 1 1 236 300" stroke="#F7F3E9" stroke-opacity="0.16" stroke-width="34" fill="none" stroke-linecap="round" filter="url(#blur6)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#mist)"/>
  </g>

  <!-- frosted glass pane -->
  <g filter="url(#shadow)">
    <rect x="182" y="182" width="660" height="660" rx="150" fill="url(#glass)"/>
    <rect x="182" y="182" width="660" height="660" rx="150" fill="none" stroke="url(#rim)" stroke-width="5"/>
  </g>
  <!-- glass highlight sweep -->
  <path d="M190 430 C 190 265, 265 190, 430 190 L 700 190 C 540 250, 330 340, 190 560 Z" fill="#FFFFFF" opacity="0.16"/>

  <!-- the seal -->
  <g filter="url(#shadow)">
    <rect x="302" y="302" width="420" height="420" rx="62" fill="url(#seal)"/>
  </g>
  <rect x="328" y="328" width="368" height="368" rx="44" fill="none" stroke="#F7F3E9" stroke-opacity="0.85" stroke-width="7"/>
  <text x="512" y="610" text-anchor="middle" font-family="Noto Serif CJK JP" font-weight="600" font-size="275" fill="#FBF7EE">紙</text>
  <path d="M302 320 Q 512 280 722 320 L 722 460 Q 512 410 302 460 Z" fill="url(#gloss)" opacity="0.55" clip-path="url(#sealclip)"/>
  <clipPath id="sealclip"><rect x="302" y="302" width="420" height="420" rx="62"/></clipPath>

  <!-- outer tile rim -->
  <rect x="41" y="41" width="942" height="942" rx="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>
</svg>
